<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You! - AlkaLean App</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 50px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .icon {
            font-size: 80px;
            color: #057932;
            margin-bottom: 20px;
        }
        h1 {
            color: #111;
            font-size: 36px;
            font-weight: 800;
            margin: 0 0 15px 0;
        }
        p {
            color: #555;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .highlight {
            color: #f23131;
            font-weight: 700;
        }
        .btn {
            display: inline-block;
            background-color: #057932;
            color: #ffffff;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #045c25;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✅</div>
        <h1>Thank You!</h1>
        <p>Your order is confirmed and your purchase was successful.</p>
        <p>All the access information and instructions have been sent directly to your <span class="highlight">email address</span>.</p>
        <p>Please check your inbox (and spam/junk folder just in case) in the next few minutes.</p>
        <br>
        <a href="/app" class="btn">Go to App</a>
    </div>
</body>
</html>
