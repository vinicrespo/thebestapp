            font-weight: 800;
            line-height: 1.3;
            color: #111;
            text-transform: uppercase;

        .text-tan { color: #b78762; }
        .text-blue { color: #214dbf; }
        .text-green { color: #169324; }

        .button-wrapper {
            margin-top: 20px;
            padding: 0 20px;

        @media(max-width: 480px) {
            .offer-header h1 { font-size: 26px; }
